services:
  redis:
    image: redis:7-alpine
    container_name: studybuddy-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - studybuddy-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studybuddy-api
    restart: always
    init: true
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - api_uploads:/app/uploads
    environment:
      # Redis Connection (Internal Docker Network)
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Supabase & PostgreSQL
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - DATABASE_URL=${DATABASE_URL}
      # LLM & Embedding Providers
      - GROQ_API_KEY=${GROQ_API_KEY}
      - EMBEDDING_KEY=${EMBEDDING_KEY}
      - MODAL_NAME=${MODAL_NAME}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - studybuddy-network

volumes:
  redis_data:
    driver: local
  api_uploads:
    driver: local

networks:
  studybuddy-network:
    driver: bridge
